[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-player-heads"
version = "1.3.0b1"
description = "Головы игроков со скинами для Endstone"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.entry-points.endstone]
player_heads = "endstone_player_heads.plugin:PlayerHeadsPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
endstone_player_heads = ["config.toml"]

