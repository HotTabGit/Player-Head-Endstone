name: Publish Player Heads beta
on:
  push:
    branches: [beta/live-head-skins]
    paths: [.github/workflows/player-heads-beta.yml, pyproject.toml]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, 'Publish Player Heads 1.3.0 Beta 7')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Publish and verify Beta 7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/player-heads-beta.md <<'EOF'
          Скины поставленных голов появляются сразу. Для надетых голов нужен обновлённый ресурспак. Бета возвращает видимость голов, выданных в Beta 6.

          Endstone 0.11.15, Bedrock 26.60. Замени старый .whl в plugins и сохрани папку plugins/player_heads. Для мгновенных скинов поставленных голов включи live_placed_skins в config.toml.
          EOF
          tag=v1.3.0-beta.7
          asset=endstone_player_heads-1.3.0b7-py3-none-any.whl
          gh release create "$tag" "dist/$asset" --target "$GITHUB_SHA" --title 'Player Heads 1.3.0 Beta 7' --prerelease --latest=false --notes-file /tmp/player-heads-beta.md
          gh release download "$tag" --pattern "$asset" --dir /tmp/verified-heads
          cmp "dist/$asset" "/tmp/verified-heads/$asset"
      - name: Remove superseded beta releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in v1.3.0-beta.{1..6}; do
            if gh release view "$tag" --json isPrerelease --jq '.isPrerelease' 2>/dev/null | grep -qx true; then
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done

