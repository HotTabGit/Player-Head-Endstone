name: Publish Player Heads beta
on:
  push:
    branches: [beta/live-head-skins]
    paths: [.github/workflows/player-heads-beta.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/player-heads-beta.md <<'EOF'
          Экспериментальные скины поставленных голов без перезапуска сервера. Цель — Endstone 0.11.15, протокол Bedrock 2225.

          Положи .whl в plugins вместо предыдущей версии, сохранив папку plugins/player_heads. В config.toml добавь live_placed_skins = true в секцию [heads] и выполни /heads reload.

          Предметы и надетые головы по-прежнему используют обычные пакеты. Новый режим по умолчанию выключен. Проверено тестами, вид на клиенте ещё не проверен.
          EOF
          gh release create v1.3.0-beta.1 dist/*.whl --target "$GITHUB_SHA" --title 'Player Heads 1.3.0 Beta 1' --prerelease --latest=false --notes-file /tmp/player-heads-beta.md
