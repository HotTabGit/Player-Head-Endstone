[heads]
# Настройки применяются через /heads reload.
enabled = true
# Только убийства игроками.
pvp_only = true
# Шанс выпадения, 0–100%.
drop_chance_percent = 100
# Пауза для той же пары, 0 — без паузы.
pair_cooldown_seconds = 0
# Обычная голова до подключения скина.
item_type = "minecraft:player_head"
item_data = 0
# Бета: скины поставленных голов без рестарта.
live_placed_skins = false
